  <text x="191" y="88" font-family="Arial" font-size="1.9" fill="#000000">Each film coated tablet contains :</text>
  <text x="191" y="90.5" font-family="Arial" font-size="1.9" fill="#000000">Aceclofenac</text>
  <text x="220" y="90.5" font-family="Arial" font-size="1.9" fill="#000000">I.P.</text>
  <text x="255" y="90.5" font-family="Arial" font-size="1.9" fill="#000000" text-anchor="end">100 mg.</text>
  <text x="191" y="93" font-family="Arial" font-size="1.9" fill="#000000">Paracetamol</text>
  <text x="220" y="93" font-family="Arial" font-size="1.9" fill="#000000">I.P.</text>
  <text x="255" y="93" font-family="Arial" font-size="1.9" fill="#000000" text-anchor="end">325 mg.</text>
  <text x="191" y="95.5" font-family="Arial" font-size="1.9" fill="#000000">1.5 Lac Armour units of Enzymatics Activity (Supplied by a</text>
  <text x="191" y="98" font-family="Arial" font-size="1.9" fill="#000000">purified concentrate which has specific Trypsin and</text>
  <text x="191" y="100.5" font-family="Arial" font-size="1.9" fill="#000000">Chymotrypsin Activity in a ratio of Approximately 6:1</text>
  <text x="191" y="103" font-family="Arial" font-size="1.9" fill="#000000">Excipients</text>
  <text x="255" y="103" font-family="Arial" font-size="1.9" fill="#000000" text-anchor="end">Q.s.</text>
  <text x="191" y="105.5" font-family="Arial" font-size="1.9" fill="#000000">Colour :  Sunset Yellow</text>
  <text x="191" y="108" font-family="Arial" font-size="1.9" fill="#000000">Dosage : As directed by the Physician.</text>
  <text x="191" y="110.5" font-family="Arial" font-weight="bold" font-size="1.9" fill="#000000">STORAGE : STORE IN A COOL, DRY &amp; DARK PLACE.</text>
  <text x="191" y="113" font-family="Arial" font-weight="bold" font-size="1.9" fill="#000000">PROTECT FROM LIGHT.</text>
  <text x="191" y="115.5" font-family="Arial" font-size="1.9" fill="#000000">Keep the Medicine out of the reach of children.</text>
  <rect x="191" y="117.5" width="66" height="11" fill="none" stroke="#000000" stroke-width="0.25"/>
  <text x="192.2" y="120" font-family="Arial" font-size="1.76" fill="#000000">Warning : Taking more than daily dose of Paracetamol</text>
  <text x="192.2" y="122.3" font-family="Arial" font-size="1.76" fill="#000000">may cause serious liver damage or allergic reactions</text>
  <text x="192.2" y="124.6" font-family="Arial" font-size="1.76" fill="#000000">(eg. swelling of the face, mouth and throat, difficulty in</text>
  <text x="192.2" y="126.9" font-family="Arial" font-size="1.76" fill="#000000">breathing, itching or rash.)</text>
  <rect x="191" y="130.5" width="66" height="6" fill="#E31712"/>
  <text x="192.2" y="133" font-family="Arial" font-weight="bold" font-size="1.9" fill="#FFFFFF">CAUTION : Not to be sold by retail without the</text>
  <text x="192.2" y="135.5" font-family="Arial" font-weight="bold" font-size="1.9" fill="#FFFFFF">prescription of a Registered Medical Practitioner.</text>
  <text x="191" y="139.5" font-family="Arial" font-size="1.9" fill="#000000">Mfg. by : Bajaj Formulations</text>
  <text x="191" y="142" font-family="Arial" font-weight="bold" font-size="1.9" fill="#000000">(A WHO-GMP &amp; ISO 9001 : 2015 Certified Co.)</text>
  <text x="191" y="144.5" font-family="Arial" font-size="1.9" fill="#000000">Khasra No. 161, Village- Lakeshwary,</text>
